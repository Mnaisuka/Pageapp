<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简 HTML 页面管理框架</title>
  <style>
    :root {
      --bg-main: #fcfcfc;
      --bg-sidebar: #f7f7f8;
      --bg-card: #ffffff;
      --border-color: #e5e5e5;
      --text-primary: #171717;
      --text-secondary: #666666;
      --text-muted: #8e8e93;
      --accent-color: #000000;
      --hover-color: #f0f0f0;
      --active-color: #e0e0e0;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* 侧边栏遮罩 */
    .sidebar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.15);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 99;
    }

    /* 抽屉式侧边栏 - 灰白极简风格 */
    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 290px;
      height: 100%;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .app-container.sidebar-open .sidebar {
      transform: translateX(0);
    }

    .app-container.sidebar-open .sidebar-overlay {
      opacity: 1;
      visibility: visible;
    }

    .sidebar-header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .add-btn {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .add-btn:hover {
      opacity: 0.85;
    }

    /* 目录列表 */
    .menu-list {
      list-style: none;
      padding: 12px 8px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .menu-item {
      display: flex;
      align-items: center;
      margin-bottom: 2px;
      position: relative;
      border-radius: 6px;
      transition: background-color 0.15s;
    }

    .menu-item:hover {
      background-color: var(--hover-color);
    }

    .menu-item.active {
      background-color: var(--active-color);
    }

    .menu-link {
      flex: 1;
      min-width: 0;
      display: block;
      padding: 10px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-item.active .menu-link {
      color: var(--text-primary);
      font-weight: 500;
    }

    .action-btn-group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    @media (hover: hover) and (pointer: fine) {
      .menu-item:hover .action-btn-group,
      .menu-item:focus-within .action-btn-group {
        opacity: 1;
      }
    }

    @media (hover: none), (pointer: coarse) {
      .action-btn-group {
        opacity: 1;
      }
    }

    .action-btn-group:focus-within {
      opacity: 1;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.15s, background-color 0.15s;
    }

    .icon-btn:hover {
      color: var(--text-primary);
      background-color: rgba(0, 0, 0, 0.05);
    }

    .icon-btn.delete-btn:hover {
      color: #e74c3c;
    }

    /* 侧边栏底部区域 */
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-sidebar);
    }

    .log-toggle-btn {
      width: 100%;
      background-color: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, color 0.15s;
    }

    .log-toggle-btn:hover {
      background-color: var(--hover-color);
      color: var(--text-primary);
    }

    /* 主内容区 */
    .main-content {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
    }

    .top-bar {
      height: 48px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    .toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      transition: background-color 0.15s;
    }

    .toggle-btn:hover {
      background-color: var(--hover-color);
    }

    .current-title {
      margin-left: 14px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .content-frame {
      width: 100%;
      height: calc(100% - 48px);
      border: none;
      background-color: #ffffff;
    }

    /* 底部日志面板 */
    .log-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 360px;
      background-color: #1e1e1e;
      color: #d4d4d4;
      border-top: 1px solid #333;
      z-index: 150;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.8rem;
    }

    .log-panel.show {
      transform: translateY(0);
    }

    .log-header {
      padding: 8px 16px;
      background-color: #252526;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-header-title {
      font-weight: 600;
      color: #cccccc;
    }

    .log-actions {
      display: flex;
      gap: 8px;
    }

    .log-action-btn {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .log-action-btn:hover {
      background-color: #333;
      color: #fff;
    }

    .log-content {
      flex: 1;
      min-height: 80px;
      padding: 10px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .js-runner {
      flex: 0 0 132px;
      padding: 8px 16px 10px;
      background-color: #252526;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .js-runner-label {
      color: #cccccc;
      font-size: 0.75rem;
    }

    .js-runner-controls {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 8px;
    }

    .js-runner textarea {
      flex: 1;
      min-width: 0;
      min-height: 0;
      resize: vertical;
      padding: 7px 9px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #1e1e1e;
      color: #d4d4d4;
      outline: none;
      font: inherit;
      line-height: 1.4;
    }

    .js-runner textarea:focus {
      border-color: #888;
    }

    .js-runner button {
      align-self: flex-end;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 10px;
      background-color: #333;
      color: #fff;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }

    .js-runner button:hover {
      background-color: #444;
    }

    .log-item {
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 2px;
    }

    .log-item.log { color: #d4d4d4; }
    .log-item.info { color: #3794ff; }
    .log-item.warn { color: #cca700; }
    .log-item.error { color: #f14c4c; }

    /* Modal 弹窗 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background-color: var(--bg-card);
      width: 90%;
      max-width: 520px;
      border-radius: 10px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .modal-header {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      background-color: #fafafa;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent-color);
      background-color: #ffffff;
    }

    .form-group textarea {
      height: 160px;
      resize: vertical;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.82rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background-color 0.15s;
    }

    .btn-cancel {
      background-color: #ffffff;
      color: var(--text-secondary);
    }

    .btn-cancel:hover {
      background-color: var(--hover-color);
    }

    .btn-submit {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .btn-submit:hover {
      opacity: 0.85;
    }

    @media (max-width: 767px) {
      .sidebar {
        width: min(290px, 88vw);
      }

      .action-btn-group {
        opacity: 1;
      }

      .menu-item {
        min-height: 44px;
      }

      .menu-link {
        padding: 10px 8px 10px 12px;
      }

      .icon-btn {
        min-width: 38px;
        min-height: 38px;
        padding: 8px;
      }

      .top-bar {
        height: 52px;
        padding: 0 12px;
      }

      .content-frame {
        height: calc(100% - 52px);
      }

      .current-title {
        max-width: calc(100vw - 70px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .log-panel {
        height: min(65vh, 500px);
      }

      .log-header {
        padding: 8px 12px;
      }

      .log-content {
        padding: 8px 12px;
        font-size: 0.75rem;
      }

      .js-runner {
        flex-basis: 142px;
        padding-left: 12px;
        padding-right: 12px;
      }

      .modal {
        align-items: flex-start;
        padding: max(12px, env(safe-area-inset-top)) 12px
          max(12px, env(safe-area-inset-bottom));
        overflow-y: auto;
      }

      .modal-content {
        width: 100%;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        padding: 18px 16px;
      }

      .modal-actions {
        position: sticky;
        bottom: -18px;
        padding: 12px 0 2px;
        background: var(--bg-card);
      }

      .modal-actions .btn {
        flex: 1;
        min-height: 42px;
      }

      .form-group textarea {
        min-height: 180px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>页面目录</h2>
        <button class="add-btn" id="openAddModalBtn">+ 添加页面</button>
      </div>
      <ul class="menu-list" id="menuList">
        <!-- 动态装载 -->
      </ul>
      <div class="sidebar-footer">
        <button class="log-toggle-btn" id="toggleLogBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
          控制台日志
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <button class="toggle-btn" id="toggleBtn" title="切换边栏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <span class="current-title" id="currentTitle">无选中的页面</span>
      </div>
      <iframe name="contentFrame" id="contentFrame" class="content-frame"></iframe>

      <!-- 控制台日志面板 -->
      <div class="log-panel" id="logPanel">
        <div class="log-header">
          <span class="log-header-title">Console Output</span>
          <div class="log-actions">
            <button class="log-action-btn" id="clearLogBtn">清空日志</button>
            <button class="log-action-btn" id="closeLogBtn">关闭</button>
          </div>
        </div>
        <div class="log-content" id="logContent"></div>
        <div class="js-runner">
          <label class="js-runner-label" for="jsCodeInput">执行 JavaScript（Ctrl + Enter 运行）</label>
          <div class="js-runner-controls">
            <textarea id="jsCodeInput" spellcheck="false" placeholder="document.body.style.background = '#f5f5f5';&#10;console.log('执行成功');"></textarea>
            <button type="button" id="runJsBtn">运行</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑 Modal -->
  <div class="modal" id="pageModal">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">新建页面</div>
      
      <div class="form-group">
        <label for="pageTitleInput">目录名称</label>
        <input type="text" id="pageTitleInput" placeholder="请输入页面标题">
      </div>

      <div class="form-group" id="typeGroup">
        <label for="contentTypeSelect">加载类型</label>
        <select id="contentTypeSelect">
          <option value="code">粘贴 HTML 代码</option>
          <option value="url">文件路径 / 网址 URL</option>
        </select>
      </div>

      <div class="form-group" id="codeGroup">
        <label for="htmlCodeInput">HTML 内容</label>
        <textarea id="htmlCodeInput" placeholder="<h1>Hello World</h1>&#10;<script>console.log('测试输出');<\/script>"></textarea>
      </div>

      <div class="form-group" id="urlGroup" style="display: none;">
        <label for="pageUrlInput">文件路径或链接</label>
        <input type="text" id="pageUrlInput" placeholder="./pages/demo.html 或 https://example.com">
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" id="closeModalBtn">取消</button>
        <button class="btn btn-submit" id="submitModalBtn">保存</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_ITEMS = 'app_sidebar_pages_v2';
    const STORAGE_KEY_LAST_ACTIVE = 'app_sidebar_last_active_v2';

    const appContainer = document.getElementById('appContainer');
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const menuList = document.getElementById('menuList');
    const contentFrame = document.getElementById('contentFrame');
    const currentTitle = document.getElementById('currentTitle');

    let pages = [];
    let activeId = null;
    let editingId = null; // 当前正在编辑的 ID，若为 null 则代表新增
    function safeStorageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        appendLog('error', ['读取本地数据失败:', error]);
        return null;
      }
    }

    function safeStorageSet(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (error) {
        appendLog('error', ['保存本地数据失败:', error]);
        return false;
      }
    }

    function isValidPage(page) {
      return page && typeof page === 'object' &&
        typeof page.id === 'string' && page.id &&
        typeof page.title === 'string' &&
        (page.type === 'code' || page.type === 'url') &&
        typeof page.content === 'string';
    }

    // 初始化
    function initData() {
      const savedPages = safeStorageGet(STORAGE_KEY_ITEMS);
      if (savedPages) {
        try {
          const parsedPages = JSON.parse(savedPages);
          pages = Array.isArray(parsedPages) ? parsedPages.filter(isValidPage) : [];
        } catch (error) {
          pages = [];
          appendLog('warn', ['本地页面数据已损坏，已恢复默认页面:', error]);
        }
      }

      if (!pages || pages.length === 0) {
        pages = [
          {
            id: 'default-1',
            title: '示例与测试页',
            type: 'code',
            content: `<div style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:30px;color:#333;">
              <h2 style="font-size:20px;margin-bottom:12px;">欢迎使用控制台测试与编辑面板</h2>
              <p style="color:#666;line-height:1.6;margin-bottom:16px;">1. 悬停在左侧边栏此目录项上，点击编辑图标 <b>✎</b> 即可直接修改 HTML。</p>
              <p style="color:#666;line-height:1.6;margin-bottom:16px;">2. 点击下方按钮测试 JavaScript 控制台输出，并打开底部日志面板查看结果。</p>
              <button onclick="console.log('这是一条 普通日志:', new Date().toLocaleTimeString())" style="padding:6px 12px;margin-right:8px;cursor:pointer;">输出 Log</button>
              <button onclick="console.warn('这是一条 警告信息!')" style="padding:6px 12px;margin-right:8px;cursor:pointer;">输出 Warn</button>
              <button onclick="console.error('这是一条 错误日志!')" style="padding:6px 12px;cursor:pointer;">输出 Error</button>
            </div>`
          }
        ];
        savePagesToStorage();
      }

      activeId = safeStorageGet(STORAGE_KEY_LAST_ACTIVE);
      if (!pages.some(p => p.id === activeId)) {
        activeId = pages[0].id;
      }

      renderMenuList();
      loadPage(activeId);
    }

    function savePagesToStorage() {
      return safeStorageSet(STORAGE_KEY_ITEMS, JSON.stringify(pages));
    }

    function saveLastActiveToStorage(id) {
      safeStorageSet(STORAGE_KEY_LAST_ACTIVE, id);
    }

    // 渲染目录列表
    function renderMenuList() {
      menuList.innerHTML = '';
      pages.forEach(page => {
        const li = document.createElement('li');
        li.className = `menu-item ${page.id === activeId ? 'active' : ''}`;

        const a = document.createElement('a');
        a.href = '#';
        a.className = 'menu-link';
        a.textContent = page.title;
        a.onclick = (e) => {
          e.preventDefault();
          switchActivePage(page.id);
        };

        const actionGroup = document.createElement('div');
        actionGroup.className = 'action-btn-group';

        const editBtn = document.createElement('button');
        editBtn.className = 'icon-btn';
        editBtn.innerHTML = '✎';
        editBtn.title = '编辑 HTML 内容';
        editBtn.onclick = (e) => {
          e.stopPropagation();
          openEditModal(page.id);
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn delete-btn';
        delBtn.innerHTML = '×';
        delBtn.title = '删除页面';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deletePage(page.id);
        };

        actionGroup.appendChild(editBtn);
        actionGroup.appendChild(delBtn);

        li.appendChild(a);
        li.appendChild(actionGroup);
        menuList.appendChild(li);
      });
    }

    // 加载页面到 iframe 并在加载完成后注入 Console 捕获脚本
    function loadPage(id) {
      const page = pages.find(p => p.id === id);
      if (!page) {
        appendLog('warn', ['找不到要加载的页面:', id]);
        return;
      }

      activeId = id;
      saveLastActiveToStorage(id);
      currentTitle.textContent = page.title;

      if (page.type === 'code') {
        const bridge = `<script>(function(){var send=function(type,args){try{window.parent.postMessage({source:'pageapp-console',type:type,args:Array.prototype.slice.call(args).map(function(value){try{if(value instanceof Error)return value.stack||value.message;return typeof value==='object'&&value!==null?JSON.stringify(value):String(value)}catch(e){return String(value)}})},'*')}catch(e){}};['log','info','warn','error','debug','dir','table','trace','assert','count','group','groupCollapsed','groupEnd','time','timeEnd','timeLog','clear'].forEach(function(type){var original=console[type];console[type]=function(){send(type,arguments);if(typeof original==='function')original.apply(console,arguments)}});window.addEventListener('error',function(e){send('error',['页面运行错误: '+e.message+' ('+e.filename+':'+e.lineno+')'])});window.addEventListener('unhandledrejection',function(e){send('error',['未处理的 Promise 异常:',e.reason])})})()<\/script>`;
        contentFrame.removeAttribute('src');
        contentFrame.srcdoc = bridge + (page.content || '');
      } else if (page.type === 'url') {
        try {
          contentFrame.removeAttribute('srcdoc');
          contentFrame.src = page.content;
        } catch (error) {
          appendLog('error', ['页面地址无效:', error]);
        }
      }

      // 更新高亮样式
      const items = menuList.querySelectorAll('.menu-item');
      pages.forEach((p, index) => {
        if (items[index]) {
          items[index].classList.toggle('active', p.id === id);
        }
      });
    }

    // 重写 iframe 内的 console 实现捕获日志
    contentFrame.addEventListener('load', () => {
      try {
        const frameWindow = contentFrame.contentWindow;
        if (!frameWindow) return;

        const activePage = pages.find(page => page.id === activeId);
        if (!activePage || activePage.type !== 'url') return;

        ['log', 'warn', 'error', 'info', 'debug', 'dir', 'table', 'trace', 'assert', 'count', 'group', 'groupCollapsed', 'groupEnd', 'time', 'timeEnd', 'timeLog', 'clear'].forEach(method => {
          const original = frameWindow.console[method];
          frameWindow.console[method] = function (...args) {
            appendLog(method, args);
            if (typeof original === 'function') original.apply(frameWindow.console, args);
          };
        });
      } catch (e) {
        appendLog('warn', ['跨域 URL 无法直接监听其控制台日志:', e]);
      }
    });

    window.addEventListener('message', event => {
      if (event.source !== contentFrame.contentWindow ||
          !event.data || event.data.source !== 'pageapp-console') return;
      appendLog(event.data.type || 'log', Array.isArray(event.data.args) ? event.data.args : [event.data.args]);
    });

    window.addEventListener('error', event => {
      appendLog('error', ['宿主页面运行错误:', event.error || event.message]);
    });

    window.addEventListener('unhandledrejection', event => {
      appendLog('error', ['宿主页面未处理的 Promise 异常:', event.reason]);
    });

    function switchActivePage(id) {
      loadPage(id);
      if (window.innerWidth < 768) closeSidebar();
    }

    function deletePage(id) {
      if (pages.length <= 1) {
        alert('请至少保留一个页面！');
        return;
      }
      if (!confirm('确定要删除该目录页面吗？')) return;

      pages = pages.filter(p => p.id !== id);
      savePagesToStorage();

      if (activeId === id) activeId = pages[0].id;
      renderMenuList();
      loadPage(activeId);
    }

    // 控制台日志功能实现
    const logPanel = document.getElementById('logPanel');
    const logContent = document.getElementById('logContent');
    const toggleLogBtn = document.getElementById('toggleLogBtn');
    const closeLogBtn = document.getElementById('closeLogBtn');
    const clearLogBtn = document.getElementById('clearLogBtn');
    const jsCodeInput = document.getElementById('jsCodeInput');
    const runJsBtn = document.getElementById('runJsBtn');

    toggleLogBtn.addEventListener('click', () => {
      logPanel.classList.toggle('show');
      if (window.innerWidth < 768) closeSidebar();
    });

    closeLogBtn.addEventListener('click', () => {
      logPanel.classList.remove('show');
    });

    clearLogBtn.addEventListener('click', () => {
      logContent.innerHTML = '';
    });

    function runJsCode() {
      const code = jsCodeInput.value.trim();
      if (!code) {
        appendLog('warn', ['请输入要执行的 JavaScript 代码。']);
        jsCodeInput.focus();
        return;
      }

      try {
        const frameWindow = contentFrame.contentWindow;
        if (!frameWindow) {
          appendLog('error', ['当前页面尚未加载完成，无法执行 JavaScript。']);
          return;
        }

        const result = frameWindow.eval(code);
        if (result instanceof Promise) {
          result.then(value => {
            if (value !== undefined) appendLog('log', ['执行结果:', value]);
          }).catch(error => {
            appendLog('error', ['JavaScript 执行失败:', error]);
          });
        } else if (result !== undefined) {
          appendLog('log', ['执行结果:', result]);
        }
      } catch (error) {
        appendLog('error', ['JavaScript 执行失败:', error]);
      }
    }

    runJsBtn.addEventListener('click', runJsCode);
    jsCodeInput.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        runJsCode();
      }
    });

    function appendLog(type, args) {
      try {
        const normalizedType = ['log', 'info', 'warn', 'error'].includes(type) ? type : 'log';
        const item = document.createElement('div');
        item.className = `log-item ${normalizedType}`;

        const formattedArgs = (Array.isArray(args) ? args : [args]).map(arg => {
          if (arg instanceof Error) return arg.stack || arg.message;
          if (typeof arg === 'object' && arg !== null) {
            try { return JSON.stringify(arg); } catch (error) { return String(arg); }
          }
          return String(arg);
        }).join(' ');

        const time = new Date().toLocaleTimeString();
        item.textContent = `[${time}] [${normalizedType.toUpperCase()}] ${formattedArgs}`;
        logContent.appendChild(item);
        while (logContent.children.length > 1000) logContent.removeChild(logContent.firstChild);
        logContent.scrollTop = logContent.scrollHeight;
      } catch (error) {
        // 日志本身不能再抛出异常，避免遮蔽原始错误。
      }
    }

    ['log', 'info', 'warn', 'error', 'debug', 'dir', 'table', 'trace', 'assert', 'count', 'group', 'groupCollapsed', 'groupEnd', 'time', 'timeEnd', 'timeLog', 'clear'].forEach(method => {
      const original = console[method];
      if (typeof original !== 'function') return;
      console[method] = function (...args) {
        appendLog(method, args);
        return original.apply(console, args);
      };
    });

    // 侧边栏与手势
    function openSidebar() { appContainer.classList.add('sidebar-open'); }
    function closeSidebar() { appContainer.classList.remove('sidebar-open'); }
    function toggleSidebar() { appContainer.classList.toggle('sidebar-open'); }

    toggleBtn.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    let startX = 0, startY = 0;
    window.addEventListener('touchstart', e => { 
      startX = e.touches[0].clientX; 
      startY = e.touches[0].clientY; 
    }, { passive: true });

    window.addEventListener('touchend', e => {
      // 若触摸点位于弹窗内，忽略手势切换
      if (e.target.closest('.modal-content')) return;

      if (!e.changedTouches || !e.changedTouches[0]) return;
      const diffX = e.changedTouches[0].clientX - startX;
      const diffY = e.changedTouches[0].clientY - startY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 50 && startX < 80) openSidebar();
        else if (diffX < -50) closeSidebar();
      }
    });

    // 弹窗与添加/编辑逻辑
    const pageModal = document.getElementById('pageModal');
    const modalTitle = document.getElementById('modalTitle');
    const openAddModalBtn = document.getElementById('openAddModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const submitModalBtn = document.getElementById('submitModalBtn');
    const contentTypeSelect = document.getElementById('contentTypeSelect');
    const codeGroup = document.getElementById('codeGroup');
    const urlGroup = document.getElementById('urlGroup');
    const typeGroup = document.getElementById('typeGroup');

    const pageTitleInput = document.getElementById('pageTitleInput');
    const htmlCodeInput = document.getElementById('htmlCodeInput');
    const pageUrlInput = document.getElementById('pageUrlInput');

    function openAddModal() {
      editingId = null;
      modalTitle.textContent = '新建页面';
      pageTitleInput.value = '';
      htmlCodeInput.value = '';
      pageUrlInput.value = '';
      contentTypeSelect.value = 'code';
      typeGroup.style.display = 'block';
      codeGroup.style.display = 'block';
      urlGroup.style.display = 'none';
      pageModal.classList.add('show');
    }

    function openEditModal(id) {
      const page = pages.find(p => p.id === id);
      if (!page) return;

      editingId = id;
      modalTitle.textContent = '编辑页面';
      pageTitleInput.value = page.title;
      contentTypeSelect.value = page.type;
      typeGroup.style.display = 'none'; // 编辑时隐藏类型切换

      if (page.type === 'code') {
        htmlCodeInput.value = page.content;
        codeGroup.style.display = 'block';
        urlGroup.style.display = 'none';
      } else {
        pageUrlInput.value = page.content;
        codeGroup.style.display = 'none';
        urlGroup.style.display = 'block';
      }

      pageModal.classList.add('show');
    }

    openAddModalBtn.addEventListener('click', openAddModal);
    closeModalBtn.addEventListener('click', () => pageModal.classList.remove('show'));

    contentTypeSelect.addEventListener('change', (e) => {
      const isCode = e.target.value === 'code';
      codeGroup.style.display = isCode ? 'block' : 'none';
      urlGroup.style.display = isCode ? 'none' : 'block';
    });

    submitModalBtn.addEventListener('click', () => {
      const title = pageTitleInput.value.trim();
      const type = contentTypeSelect.value;
      let content = type === 'code' ? htmlCodeInput.value : pageUrlInput.value.trim();

      if (!title) { alert('请输入目录名称！'); return; }
      if (!content) { alert('请输入或粘贴内容！'); return; }

      if (editingId) {
        // 编辑已有数据
        const page = pages.find(p => p.id === editingId);
        if (page) {
          page.title = title;
          page.content = content;
        }
      } else {
        // 新增数据
        const newPage = { id: 'page_' + Date.now(), title, type, content };
        pages.push(newPage);
        editingId = newPage.id;
      }

      if (!savePagesToStorage()) return;
      renderMenuList();
      loadPage(editingId || activeId);
      pageModal.classList.remove('show');
    });

    initData();
  </script>
</body>
</html>
